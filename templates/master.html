<!-- Global Template -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Student Management System{% endblock %}</title>

        <!-- Global CSS -->
        <link rel="shortcut icon"
              href="{% static '/favicon/django-icon-svgrepo-com.svg' %}"
              type="image/x-icon" />
        <link rel="stylesheet" href="{% static '/css/bootstrap.min.css' %}" />
        <link rel="stylesheet" href="{% static '/css/bootstrap-icons.css' %}">
        <link rel="stylesheet" href="{% static '/css/index.css' %}" />

        <!-- App Specific Extra CSS -->
        {% block extra_css %}{% endblock %}

    </head>
    <body class="{% block body_class %}{% endblock %}">

        <!-- Global Messages / Alerts (Success, Error toasts) -->
        {% if messages %}
            <div class="container-fluid mt-2">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
                         role="alert">
                        {{ message }}
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- App Layout -->
        {% block app_layout %}{% endblock %}

        <!-- Global JS -->
        <script src="{% static '/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static '/js/index.js' %}"></script>

        <!-- App Specific Extra JS -->
        {% block extra_js %}{% endblock %}
    </body>
</html>
