{% extends "accounts/master.html" %}

{% block title %}Password Reset Complete | Student Management System{% endblock %}

{% block content %}
  <div class="row justify-content-center align-items-center" style="min-height: 100vh">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
      <div class="card text-light shadow border-0 rounded-3 text-center"
           style="background-color: rgb(0 0 0 / 21%)">
        <div class="card-body p-4 p-sm-5">

          <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
          <h3 class="fw-bold mt-3">Password Updated</h3>
          <p class="small text-secondary mt-2">
            Your password has been changed successfully. You can now use your new credentials to sign in.
          </p>

          <a href="{% url 'login' %}"
             class="primary-btn bg-danger border border-danger d-inline-block text-decoration-none px-4 py-2 mt-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Now
          </a>

        </div>
      </div>
    </div>
  </div>
{% endblock %}
